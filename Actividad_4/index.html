<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="author" content="CAMINOS, Albano">
    <title>Formularios</title>
</head>
<body>
    <header>
        <h1>Inscripción al curso de programación</h1>
        <hr>
    </header>
    <main>
        <section>
            <h2>Ingresar datos:</h2>
            <form action="">
                <label for="name">Nombre:<input type="text" id="name"></label>
                <br><br>
                <labe for="lastname">Apellido:<input type="text" id="lastname"></labe>
                <br><br>
                <label for="email">Email: <input type="email" id="email"></label>
                <br><br>
                <label for="lyo">Edad: <input type="number" name="" id="lyo" min="0" max="120" value="10"></label>
                <br><br>

                <h3>Curso de elección:</h3>
                <label for="python"><input type="checkbox" name="" id="pyhton">Python</label>
                <label for="JS"><input type="checkbox" name="" id="JS">JavaScript</label>
                <label for="cpp"><input type="checkbox" name="" id="cpp">C++</label>

                <h3>Seleccionar turno:</h3>

                <select name="" id="turno">
                    <option value="_1">Día</option>
                    <option value="_2">Noche</option>
                </select>
                <br><br>
                <input type="button" value="Ingresar">
                <button>Ingresar</button>
            </form>
        </section>
    </main>
</body>
</html>
